<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripture Formatter</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    button {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
    }
    button:hover {
      background-color: #475569;
    }
    .label {
      font-weight: bold;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <h2>Scripture Formatter</h2>

  <p>This tool formats Scripture copied from web Bibles to be suitable for import into Anki's Lyrics/Poetry Cloze Generator. For more information, consult the <a href="https://github.com/jkep-chun/Scripture-Text-Formatter/blob/main/README.md">README.md</a></p>
  
  <div class="label">Paste raw text (from literalword.com, bible.com, etc.):</div>
  <textarea id="input" placeholder="Paste unformatted verses here..."></textarea>
  
  <div class="label" style="margin-top: 24px;">Output:</div>
  <textarea id="output" readonly placeholder="Formatted output will appear here..."></textarea>
  
  <div>
    <button onclick="copyOutput()">Copy Output</button>
  </div>

  <script>
    document.getElementById('input').addEventListener('input', formatText);

    function formatText() {
      const input = document.getElementById('input').value;
      const paragraphs = input.trim().split(/\r?\n/).map(p => p.trim()).filter(Boolean);

      const formatted = paragraphs.map(p => {
        // Replace leading verse number, regardless of whether it's followed by a space or not, with superscript
        p = p.replace(/^(\d+)\s*/, '<sup>$1</sup> ');
        // Also replace interior verse numbers with newline + superscript
        p = p.replace(/\s+(\d+)\s*/g, '\n<sup>$1</sup> ');
        // Append paragraph breaks
        return p + ' <br><br>';
      });

      document.getElementById('output').value = formatted.join('\n');
    }

    function copyOutput() {
      const output = document.getElementById('output');
      output.select();
      navigator.clipboard.writeText(output.value);
    }
  </script>

</body>
</html>
