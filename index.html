<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripture Formatter</title>
  <link rel="icon" type="image/png" href="jkep_chun_favicon.png">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      padding: 10px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    button {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
    }
    button:hover {
      background-color: #475569;
    }
    .label {
      font-weight: bold;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <h2>Scripture Formatter</h2>

  <p>This tool formats Scripture copied from web Bibles to be suitable for import into Anki's Lyrics/Poetry Cloze Generator. For more information, consult the <a href="https://github.com/jkep-chun/Scripture-Text-Formatter/blob/main/README.md">README.md</a></p>
  
  <div class="label">Paste raw text (from literalword.com, bible.com, etc.):</div>
  <textarea id="input" placeholder="Paste unformatted verses here..."></textarea>
  
  <div class="label" style="margin-top: 24px;">Output:</div>
  <textarea id="output" readonly placeholder="Formatted output will appear here..."></textarea>
  
  <div>
    <button onclick="copyOutput()">Copy Output</button>
    <button id="impliedText" onclick="toggleImpliedText()">Toggle Implied Text (NASB/LSB)</button>
  </div>

  <script>
    let impliedTextEnabled = false;

    const input = document.getElementById('input');
    input.addEventListener('input', formatText);
    input.addEventListener('paste', function(event) {
      event.preventDefault();

      const clipboardData = event.clipboardData || window.clipboardData;
      const htmlData = clipboardData.getData('text/html');
      const textData = clipboardData.getData('text/plain');

      if (htmlData) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlData, 'text/html');
        const body = doc.body;

        cleanElement(body);
        let cleanHTML = body.innerHTML;
        cleanHTML = cleanHTML.replace(/<!--[\s\S]*?-->/g, "");
        this.value = cleanHTML.trim();
      } else {
        this.value = textData;
      }
      formatText();
    });

    // Recursive cleaning function
    function cleanElement(element) {
      // List of allowed structural text tags you want to keep
      const allowedTags = ['I', 'BR'];

      // Loop backward through child nodes so index shifts don't break the loop
      for (let i = element.childNodes.length - 1; i >= 0; i--) {
        const child = element.childNodes[i];

        if (child.nodeType === Node.ELEMENT_NODE) {
          // If it is a tag we want to keep, strip its attributes (style, class, etc)
          if (allowedTags.includes(child.tagName)) {
            while (child.attributes.length > 0) {
                child.removeAttribute(child.attributes[0].name);
            }
            // Continue deeper into the tree
            cleanElement(child);
          } else {
            // For wrapper tags like <html>, <body>, or unneeded divs, 
            // unwrap them by replacing the tag with its internal contents
            cleanElement(child);
            while (child.firstChild) {
                element.insertBefore(child.firstChild, child);
            }
            element.removeChild(child);
          }
          }
        }
      }

    function formatText() {
      const input = document.getElementById('input').value;
      const paragraphs = input.trim().split(/\r?\n/).map(p => p.trim()).filter(Boolean);

      const formatted = paragraphs.map(p => {
        // Replacements
        // Spaces
        p = p.replace(/(\d[,.;:?!<>])([a-zA-Z])}/g, '$1 $2')
        // Interior verse numbers adjacent to nonnumber character
        p = p.replace(/(?<=[.,;:<>])(\d+)\s*/g, '\n<sup>$1</sup> ');
        // Leading <br>
        p = p.replace(/^\s*<br>\s*/, '1');
        // Leading verse number
        p = p.replace(/^(\d+)\s*/, '<sup>$1</sup> ');
        // Also replace interior verse numbers with newline + superscript
        p = p.replace(/\s+(\d+)\s*/g, '\n<sup>$1</sup> ');
        // Replace &nbsp; verse numbers with superscript
        p = p.replace(/&nbsp;(\d+)/g, '<sup>$1</sup>');
        p = p.replace(/&nbsp;/g, ' ');
        // Convert double spaces to single spaces
        p = p.replace(/ {2,}/g, ' ');
        // Double up on paragraph-dividing <br>
        p = p.replace(/<br\s*\/?>/gi, '<br><br>');
        // Empty <i></i> tags
        p = p.replace(/<i><\/i>/g, '<br>');
        p = p.replace(/\s<br>/g, ' ');
        // Remove trailing whitespace
        p = p.trim();
        // Remove any remaining [a-zA-Z] tags
        p = p.replace(/\[[a-zA-Z]\]/g, '');
        
        // If implied text is disabled, remove <i> tags
        if (!impliedTextEnabled) {
          p = p.replace(/<i>(.*?)<\/i>/g, '$1');
        }

        return p;
      });

      document.getElementById('output').value = formatted.join('\n');
    }

    function copyOutput() {
      const output = document.getElementById('output');
      output.select();
      navigator.clipboard.writeText(output.value);
    }

    function toggleImpliedText() {
      impliedTextEnabled = !impliedTextEnabled;
      formatText();
    }
  </script>

</body>
</html>
